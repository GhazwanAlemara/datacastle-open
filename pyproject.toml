[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datacastle-open"
version = "1.0.0"
description = "Open-source self-hosted EU freight 3-way reconciliation, TARIC validator, EU AI Act risk classifier & tamper-evident audit seal CLI."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Data Genius LLC", email = "ghazwan@datacastle.eu" }]
keywords = ["customs", "taric", "freight", "eu-ai-act", "compliance", "reconciliation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.urls]
Homepage = "https://datacastle.eu/open"
Repository = "https://github.com/GhazwanAlemara/datacastle-open"

[project.scripts]
datacastle-open = "datacastle_open.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
